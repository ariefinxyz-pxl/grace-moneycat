<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Grace's Money Cat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="vendor/fonts.css" rel="stylesheet">
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<style>
/* Layout concept: one centered column of soft pink cards under a sakura gradient; the cat mascot lives in the header, the dashboard hero and the savings scene. */
:root{
  --bg:#FFF1F6; --bg-top:#FFFBF7; --bg-bot:#FFE4EF;
  --card:rgba(255,255,255,.88); --card-solid:#FFFFFF; --cream:#FFF7F0;
  --ink:#4F2540; --ink-soft:#855570;
  --pink-1:#FFC7DD; --pink-2:#FFD6E8; --accent:#FF8FAB; --on-accent:#4A1B35;
  --line:#FFD0E1; --shadow:rgba(255,143,171,.30); --input-bg:#FFFFFF;
  --good:#1F8A5B; --good-bg:#DDF5E8; --inc:#7ED6A5;
  --warn:#F5B301; --warn-bg:#FFF2C7; --warn-ink:#7A5600;
  --bad:#CC3563; --bad-bg:#FFE1EA; --exp:#FF8FAB; --over:#FF5C85;
  --petal-glow:transparent; --branch:#9A6444; --cat-shadow:rgba(150,70,110,.16);
  --font-display:'Baloo 2','Quicksand',ui-rounded,system-ui,sans-serif;
  --font-body:'Quicksand',ui-rounded,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2A1424; --bg-top:#2D1627; --bg-bot:#452042;
    --card:rgba(72,36,64,.86); --card-solid:#4A2441; --cream:#3A1B33;
    --ink:#FFE6F0; --ink-soft:#E6B6CE;
    --pink-1:#6B2F52; --pink-2:#59294B; --accent:#FF8FAB; --on-accent:#3B1029;
    --line:#6E3A64; --shadow:rgba(255,143,171,.22); --input-bg:#3A1A32;
    --good:#7FE0B0; --good-bg:#1F4A3A; --inc:#6BD6A0;
    --warn:#FFD166; --warn-bg:#4F3D12; --warn-ink:#FFE08A;
    --bad:#FF9DBA; --bad-bg:#5A2238; --exp:#FF8FAB; --over:#FF6F95;
    --petal-glow:rgba(255,170,205,.5); --branch:#C98B66; --cat-shadow:rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#2A1424; --bg-top:#2D1627; --bg-bot:#452042;
  --card:rgba(72,36,64,.86); --card-solid:#4A2441; --cream:#3A1B33;
  --ink:#FFE6F0; --ink-soft:#E6B6CE;
  --pink-1:#6B2F52; --pink-2:#59294B; --accent:#FF8FAB; --on-accent:#3B1029;
  --line:#6E3A64; --shadow:rgba(255,143,171,.22); --input-bg:#3A1A32;
  --good:#7FE0B0; --good-bg:#1F4A3A; --inc:#6BD6A0;
  --warn:#FFD166; --warn-bg:#4F3D12; --warn-ink:#FFE08A;
  --bad:#FF9DBA; --bad-bg:#5A2238; --exp:#FF8FAB; --over:#FF6F95;
  --petal-glow:rgba(255,170,205,.5); --branch:#C98B66; --cat-shadow:rgba(0,0,0,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background-color:var(--bg);
  background-image:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bot) 100%);
  background-repeat:no-repeat; background-size:100% 100%;
  color:var(--ink); font-family:var(--font-body); font-weight:600; font-size:16px; line-height:1.55;
  min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 28px;
  overflow-x:hidden;
}
@media (max-width:767px){ body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))} }
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin-inline:auto;width:100%}
.sr-only-x{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}

/* ---------- header, controls, nav ---------- */
.hdr{padding-top:14px}
.hdr-in{display:flex;align-items:center;gap:6px;padding-right:100px;min-height:84px}
.brand-cat{width:98px;flex:none}
.brand-cat .cat-wrap::after{display:none}
.brand-sub{font-size:13px;color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.brand-title{font-size:clamp(21px,5.2vw,36px);color:var(--ink)}
@media (max-width:520px){.brand-cat{width:78px}.brand-sub{font-size:11px;letter-spacing:.05em}.hdr-in{padding-right:98px}}
.brand-title b{color:var(--accent);font-weight:800}
.fab-top{position:fixed;z-index:50;display:flex;gap:8px;
  top:calc(env(safe-area-inset-top,0px) + 12px);right:max(14px,env(safe-area-inset-right,0px))}
.ico-btn{width:44px;height:44px;border-radius:999px;border:2px solid var(--line);background:var(--card-solid);
  box-shadow:0 8px 20px -8px var(--shadow);font-size:21px;line-height:1;cursor:pointer;position:relative;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.ico-btn:hover{transform:scale(1.14) rotate(-8deg)}
.ico-btn:active{transform:scale(.94)}
.ico-btn[aria-pressed="false"]{opacity:.55}
.ico-btn[aria-pressed="false"]::after{content:"";position:absolute;left:9px;right:9px;top:50%;height:3px;border-radius:3px;background:var(--bad);transform:rotate(-40deg)}
.nav{display:flex;gap:6px;justify-content:center;margin:10px auto 18px;padding:6px;border-radius:999px;
  background:var(--card);border:2px solid var(--line);box-shadow:0 10px 26px -12px var(--shadow);width:fit-content;max-width:100%}
.nav a{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;font-weight:700;font-size:15px;color:var(--ink-soft);
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .2s}
.nav a b{font-size:18px;font-weight:400}
.nav a:hover{transform:translateY(-2px) scale(1.06);background:var(--pink-2);color:var(--ink)}
.nav a.on{background:var(--accent);color:var(--on-accent)}
@media (max-width:767px){
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:45;margin:0;width:auto;border-radius:26px 26px 0 0;border-width:2px 0 0;
    justify-content:space-around;gap:2px;
    padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
    background:var(--card-solid)}
  .nav a{flex-direction:column;gap:0;padding:6px 8px;font-size:11px;flex:1;min-width:0;justify-content:center}
  .nav a b{font-size:22px;line-height:1.1}
}

/* ---------- cards & type ---------- */
.card{background:var(--card);border:2px solid var(--line);border-radius:30px;padding:20px;box-shadow:0 14px 34px -14px var(--shadow);position:relative;min-width:0}
.card-pink{background:linear-gradient(135deg,var(--pink-2),var(--card));}
.sec{margin-top:18px}
.h-sec{font-size:22px;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--ink-soft)}
.small{font-size:13.5px}
.ptitle{position:relative;padding:6px 0 4px;min-height:84px;isolation:isolate}
.ptitle h2{font-size:clamp(30px,7vw,48px);color:var(--ink);position:relative;z-index:1}
.ptitle p{position:relative;z-index:1;color:var(--ink-soft);font-size:15px}
.branch{position:absolute;right:-18px;top:-26px;width:min(78%,430px);height:auto;z-index:0;opacity:.95;pointer-events:none}
.branch .stem{stroke:var(--branch)}
.page-top{margin-bottom:18px}

/* ---------- buttons, inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid transparent;border-radius:999px;
  padding:10px 20px;font:700 16px var(--font-body);cursor:pointer;
  transition:transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-3px) scale(1.06) rotate(-1.5deg)}
.btn:active{transform:scale(.95)}
.btn-primary{background:linear-gradient(180deg,#FFA3BC,var(--accent));color:var(--on-accent);box-shadow:0 10px 22px -8px var(--shadow),inset 0 -3px 0 rgba(0,0,0,.08)}
.btn-big{width:100%;padding:16px 24px;font-size:20px;font-family:var(--font-display);font-weight:700}
.btn-soft{background:var(--pink-2);color:var(--ink);border-color:var(--line)}
.btn-ghost{background:transparent;color:var(--ink-soft);border-color:var(--line)}
.btn-danger{background:var(--bad-bg);color:var(--bad);border-color:var(--line)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.mini{width:38px;height:38px;border-radius:14px;border:2px solid var(--line);background:var(--card-solid);cursor:pointer;font-size:16px;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.mini:hover{transform:scale(1.18) rotate(8deg)}
.mini.armed{width:auto;padding:0 10px;background:var(--bad);color:#fff;border-color:var(--bad);font:700 13px var(--font-body)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,.legend{font-weight:700;font-size:14px;color:var(--ink-soft)}
.inp{width:100%;border:2px solid var(--line);background:var(--input-bg);color:var(--ink);border-radius:18px;padding:11px 14px;font:600 16px var(--font-body);min-width:0}
.inp:focus{outline:3px solid var(--accent);outline-offset:1px}
.inp::placeholder{color:var(--ink-soft);opacity:.7}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.amt-wrap{position:relative}
.amt-wrap i{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-style:normal;font-weight:800;color:var(--ink-soft)}
.amt-wrap .inp{padding-left:46px;font-family:var(--font-display);font-size:24px;font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;border-radius:999px;background:var(--pink-2);border:2px solid var(--line)}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:block;text-align:center;padding:11px 8px;border-radius:999px;font-weight:700;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.seg label:hover span{transform:scale(1.04)}
.seg input:checked+span{background:var(--accent);color:var(--on-accent);box-shadow:0 6px 14px -6px var(--shadow)}
.seg input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;cursor:pointer}
.chip input{position:absolute;opacity:0;inset:0}
.chip span{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--input-bg);font-weight:700;font-size:15px;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .2s}
.chip span b{font-size:18px;font-weight:400}
.chip:hover span{transform:translateY(-2px) scale(1.06)}
.chip input:checked+span{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
fieldset{border:0;padding:0;margin:0;min-width:0}
.err{color:var(--bad);font-weight:700;min-height:22px;font-size:14.5px}
.form{display:grid;gap:18px}
.two{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:640px){.two{grid-template-columns:1fr 1fr}}

/* ---------- dashboard ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;overflow:hidden}
.hero .quote{margin-top:10px;padding:12px 16px;border-radius:22px;background:var(--card-solid);border:2px dashed var(--line);font-weight:700}
.hero-cat{display:flex;flex-direction:column;align-items:center;gap:8px;width:210px}
@media (max-width:700px){.hero{grid-template-columns:1fr}.hero-cat{width:100%;order:2}}
.bubble{position:relative;background:var(--card-solid);border:2px solid var(--line);border-radius:20px;padding:8px 14px;font-weight:700;font-size:14.5px;text-align:center;max-width:260px}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:14px;background:var(--card-solid);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.bubble.pop{animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.stats{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:768px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{border-radius:30px;padding:20px 20px 18px;border:2px solid var(--line);position:relative;overflow:hidden;box-shadow:0 14px 34px -14px var(--shadow);min-width:0}
.stat.s1{background:linear-gradient(140deg,var(--pink-1),var(--pink-2))}
.stat.s2{background:var(--pink-2)}
.stat.s3{background:var(--cream)}
:root[data-theme="dark"] .stat.s3{background:var(--cream)}
.stat .lbl{font-weight:700;color:var(--ink-soft);font-size:15px}
.stat .val{font-family:var(--font-display);font-weight:800;font-size:clamp(26px,5vw,34px);line-height:1.15;margin-top:2px;overflow-wrap:anywhere}
.stat.s2 .val{color:var(--good)} .stat.s3 .val{color:var(--bad)}
.stat .sub{font-size:13px;margin-top:8px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:4px 12px}
.sak-c{position:absolute;top:-8px;right:-8px;width:74px;height:74px;pointer-events:none;background:var(--petal-a) center/contain no-repeat;transform:rotate(18deg);opacity:.95}
.sak-c::after{content:"";position:absolute;left:-18px;top:46px;width:34px;height:34px;background:var(--petal-a) center/contain no-repeat;transform:rotate(-24deg)}
.charts{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:900px){.charts{grid-template-columns:5fr 7fr}}
.donut-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.donut{width:190px;max-width:100%;flex:none}
.dleg{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:14px;min-width:150px;flex:1}
.dleg li{display:flex;align-items:center;gap:8px}
.dleg i{width:12px;height:12px;border-radius:50%;flex:none}
.dleg em{margin-left:auto;font-style:normal;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.chart-svg{width:100%;height:auto;display:block}
.chart-svg text{fill:var(--ink-soft);font:600 11px var(--font-body)}
.chart-svg .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 5}
.bar-i{fill:var(--inc)} .bar-o{fill:var(--exp)}
.key{display:flex;gap:16px;justify-content:center;font-size:14px;margin-top:6px}
.key i{display:inline-block;width:12px;height:12px;border-radius:5px;margin-right:6px;vertical-align:-1px}
.duo{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:1000px){.duo{grid-template-columns:5fr 7fr}}
.tx-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tx{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:10px 12px;border-radius:22px;background:var(--card-solid);border:2px solid var(--line);
  transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.tx:hover{transform:translateY(-2px) scale(1.01)}
.tx-ico{display:grid;place-items:center;width:44px;height:44px;border-radius:16px;font-size:22px;background:var(--pink-2);flex:none}
.tx.in .tx-ico{background:var(--good-bg)}
.tx-main{min-width:0}
.tx-t{font-weight:700;overflow-wrap:anywhere}
.tx-n{color:var(--ink-soft);font-weight:600}
.tx-m{font-size:13px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.tx-amt{font-family:var(--font-display);font-weight:700;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tx.in .tx-amt{color:var(--good)} .tx.out .tx-amt{color:var(--bad)}
.tx-acts{display:flex;gap:6px}
@media (max-width:560px){
  .tx{grid-template-columns:auto 1fr auto}
  .tx-acts{grid-column:1/-1;justify-content:flex-end}
}
.badge{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--pink-2);border:1.5px solid var(--line);font-size:12px;font-weight:700;color:var(--ink)}
.pill{display:inline-block;padding:2px 12px;border-radius:999px;font-weight:700;font-size:14px;background:var(--pink-2);color:var(--ink)}
.pill.warn{background:var(--warn-bg);color:var(--warn-ink)} .pill.over{background:var(--bad-bg);color:var(--bad)}
.empty{text-align:center;padding:24px 10px;color:var(--ink-soft)}
.empty .cat-wrap{margin:0 auto 6px;width:130px}

/* ---------- meters ---------- */
.meter{height:16px;border-radius:999px;background:var(--pink-2);border:2px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:var(--p);border-radius:999px;background:linear-gradient(90deg,#FFB3CB,var(--accent));animation:grow .9s ease-out}
.bud.warn .meter i{background:linear-gradient(90deg,#FFE07A,var(--warn))}
.bud.over .meter i{background:linear-gradient(90deg,#FF9DB8,var(--over))}
@keyframes grow{from{width:0}}
.bud-list{list-style:none;margin:0;padding:0;display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:860px){.bud-list{grid-template-columns:1fr 1fr}}
.bud{padding:14px;border-radius:26px;background:var(--card-solid);border:2px solid var(--line);display:grid;gap:10px}
.bud.warn{border-color:var(--warn)} .bud.over{border-color:var(--over)}
.bud-h{display:flex;align-items:center;gap:12px}
.bud-h .pill{margin-left:auto}
.bud-msg{font-weight:700;font-size:14.5px}
.bud.warn .bud-msg{color:var(--warn-ink)} .bud.over .bud-msg{color:var(--bad)}
.bud-f{display:flex;gap:8px}
.cat-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cat-row .cat-wrap{width:130px;flex:none}
.cat-row .bubble{max-width:none;text-align:left;flex:1;min-width:200px}
.cat-row .bubble::after{left:-9px;bottom:auto;top:50%;transform:translateY(-50%) rotate(135deg)}
@media (max-width:520px){.cat-row .bubble::after{display:none}}

/* ---------- savings scene ---------- */
.scene{--cat:112px;--tree:150px;position:relative;height:178px;border-radius:26px;overflow:hidden;
  background:linear-gradient(180deg,var(--pink-2),var(--card-solid) 70%)}
@media (max-width:520px){.scene{--cat:84px;--tree:104px;height:150px}}
.scene .tree{position:absolute;right:0;bottom:10px;width:var(--tree);height:auto}
.scene .ground{position:absolute;left:0;right:0;bottom:0;height:22px;background:linear-gradient(180deg,#FFB3CB,var(--accent));opacity:.55;border-radius:0 0 24px 24px}
.scene .runner{position:absolute;bottom:8px;width:var(--cat);left:var(--to);animation:run 1.8s ease-out;transform:scaleX(-1)}
@keyframes run{from{left:0}to{left:var(--to)}}
.goal-line{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14.5px;margin:12px 0 6px}
.goals{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:760px){.goals{grid-template-columns:1fr 1fr}}
.goal{padding:0;overflow:hidden;display:flex;flex-direction:column}
.goal-img{height:150px;background:linear-gradient(135deg,var(--pink-1),var(--pink-2));display:grid;place-items:center;font-size:64px;overflow:hidden}
.goal-img img{width:100%;height:100%;object-fit:cover;display:block}
.goal-b{padding:16px 18px 18px;display:grid;gap:10px}
.goal-b h3{font-size:22px;overflow-wrap:anywhere}
.goal-acts{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:84px;height:84px;border-radius:20px;object-fit:cover;border:2px solid var(--line)}

/* ---------- reports ---------- */
.month-nav{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
.month-nav strong{font-family:var(--font-display);font-size:22px;min-width:170px;text-align:center}
.rep-cards{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:700px){.rep-cards{grid-template-columns:repeat(3,1fr)}}
.catbars{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.catbars li{display:grid;gap:4px}
.catbars .h{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.catbars .meter{height:12px}
.exp-btns{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- misc ---------- */
.foot{text-align:center;margin:34px 0 4px;font-family:var(--font-display);font-size:22px;color:var(--ink)}
.foot .foot-sub{font-family:var(--font-body);font-size:13px;color:var(--ink-soft);margin-top:2px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px;padding:12px 16px;border-radius:22px;background:var(--warn-bg);color:var(--warn-ink);border:2px dashed var(--warn);font-weight:700;font-size:14.5px}
.toast{position:fixed;z-index:70;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));max-width:min(92vw,460px);
  background:var(--card-solid);color:var(--ink);border:2px solid var(--accent);border-radius:999px;padding:12px 22px;font-weight:700;box-shadow:0 16px 34px -12px var(--shadow);text-align:center}
@media (min-width:768px){.toast{bottom:28px}}
.toast.show{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
.modal-back{position:fixed;inset:0;z-index:60;background:rgba(80,20,50,.45);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.modal{width:min(480px,100%);background:var(--card-solid);animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
.modal h3{font-size:24px;margin-bottom:4px}
.mscene{position:relative;height:190px;margin:12px 0;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,var(--pink-2),var(--card-solid))}
.mscene .tree{position:absolute;left:-8px;bottom:8px;width:150px}
.mscene .cat-wrap{position:absolute;left:92px;bottom:10px;width:120px}
.mscene .piggy{position:absolute;right:10px;bottom:10px;width:132px}
.mscene .ground{position:absolute;left:0;right:0;bottom:0;height:16px;background:var(--accent);opacity:.5}
.piggy.wig{animation:wig .5s ease-in-out 1.0s 2}
@keyframes wig{0%,100%{transform:rotate(0)}30%{transform:rotate(-6deg) scale(1.05)}70%{transform:rotate(6deg) scale(1.05)}}
.coin-fly{position:absolute;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF1A8,#FFD45E 55%,#E8A91F);border:3px solid #C98A12;display:grid;place-items:center;font:800 15px var(--font-display);color:#9A6200;z-index:3;opacity:0}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* ---------- sakura layer ---------- */
.sakura{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.petal{position:absolute;top:-40px;width:var(--sz);height:var(--sz);opacity:var(--op);animation:fall var(--fall) linear var(--delay) infinite}
.petal .ps{display:block;width:100%;height:100%;animation:sway var(--sway) ease-in-out infinite alternate}
.petal .pr{display:block;width:100%;height:100%;border-radius:50%;animation:spin var(--spin) linear infinite;
  background:var(--petal-a) center/contain no-repeat,radial-gradient(circle,var(--petal-glow) 0 38%,transparent 70%)}
.petal.one .pr{background:var(--petal-b) center/contain no-repeat,radial-gradient(circle,var(--petal-glow) 0 30%,transparent 65%)}
@keyframes fall{from{transform:translateY(-8vh)}to{transform:translateY(112vh)}}
@keyframes sway{from{transform:translateX(calc(var(--drift)*-1))}to{transform:translateX(var(--drift))}}
@keyframes spin{0%{transform:rotate(0) scaleX(1)}25%{transform:rotate(90deg) scaleX(.55)}50%{transform:rotate(180deg) scaleX(1)}75%{transform:rotate(270deg) scaleX(.55)}100%{transform:rotate(360deg) scaleX(1)}}
.bit{position:fixed;z-index:80;width:24px;height:24px;pointer-events:none;background:var(--petal-a) center/contain no-repeat;left:0;top:0}
.bit.heart{background:none;font-size:22px;line-height:24px;text-align:center}

/* ---------- loader ---------- */
.loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:linear-gradient(180deg,var(--bg-top),var(--bg-bot));transition:opacity .5s;animation:loaderOut .5s 5s forwards}
.loader.hide{opacity:0;pointer-events:none}
@keyframes loaderOut{to{opacity:0;visibility:hidden;pointer-events:none}}
.loader-scene{position:relative;width:min(300px,86vw);height:230px}
.loader-cat{position:absolute;left:4%;bottom:34px;width:68%;transform:scaleX(-1);animation:chasehop 2.4s ease-in-out infinite}
@keyframes chasehop{0%,40%,100%{translate:0 0}50%{translate:0 -22px}60%{translate:0 0}}
.chase-petal{position:absolute;width:34px;height:34px;background:var(--petal-a) center/contain no-repeat;animation:chase 2.4s ease-in-out infinite;left:82%;top:0}
@keyframes chase{
  0%{left:84%;top:-12%;transform:rotate(0)}
  25%{left:93%;top:18%;transform:rotate(120deg)}
  50%{left:80%;top:30%;transform:rotate(250deg)}
  72%{left:92%;top:44%;transform:rotate(400deg)}
  100%{left:84%;top:-12%;transform:rotate(540deg)}
}
.loader-text{position:absolute;left:0;right:0;bottom:0;text-align:center;font-family:var(--font-display);font-size:20px;color:var(--ink)}
.loader-ground{position:absolute;left:0;right:0;bottom:30px;height:6px;border-radius:6px;background:var(--pink-1)}

/* ---------- cat ---------- */
.cat-wrap{display:block;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent;outline-offset:4px}
.cat-wrap::after{content:"";position:absolute;left:20%;width:58%;bottom:1%;height:6%;border-radius:50%;background:var(--cat-shadow);z-index:0}
.cat-cv{display:block;position:relative;z-index:1;width:100%;height:auto}
.runner::after,.loader-cat::after{content:"";position:absolute;left:20%;width:58%;bottom:1%;height:6%;border-radius:50%;background:var(--cat-shadow);z-index:0}
.view.in{animation:viewin .5s ease-out}
@keyframes viewin{from{opacity:.01;transform:translateY(10px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){

}

/* ---------- export ---------- */
function rowsFor(ym) { return S.txs.filter(t => t.date.startsWith(ym)).sort(cmpAsc).map(t => [t.date, t.type === 'in' ? 'Pemasukan' : 'Pengeluaran', t.cat, t.note || '', t.wallet, t.type === 'out' ? (t.method || '') : '', t.type === 'in' ? t.amount : -t.amount]); }
const HEAD_ROW = ['Tanggal', 'Jenis', 'Kategori', 'Keterangan', 'Dompet', 'Metode', 'Jumlah (Rp)'];
/* ---------- simpan / bagikan file (Android + browser) ---------- */
const isNative = () => !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
async function saveFile(name, data, mime, isB64) {
  if (isNative()) {
    const { Filesystem, Share } = Capacitor.Plugins;
    const o = { path: name, data, directory: 'CACHE' }; if (!isB64) o.encoding = 'utf8';
    await Filesystem.writeFile(o);
    const r = await Filesystem.getUri({ path: name, directory: 'CACHE' });
    try { await Share.share({ title: name, files: [r.uri], dialogTitle: 'Simpan atau kirim file' }); } catch (e) { /* dibatalkan */ }
    return;
  }
  let blob;
  if (isB64) { const bin = atob(data), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); blob = new Blob([u], { type: mime }); }
  else blob = new Blob([data], { type: mime });
  const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function doBackup() {
  const d = new Date(), ymd = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  saveFile(`Backup-GraceMoneyCat-${ymd}.json`, JSON.stringify({ app: 'GraceMoneyCat', exportedAt: d.toISOString(), data: S }), 'application/json', false)
    .then(() => toast('Backup siap. Simpan di tempat aman ya, Grace 💾')).catch(() => toast('Backup gagal dibuat. Coba lagi ya.'));
}
function doRestore(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const j = JSON.parse(rd.result), d = j && j.data ? j.data : j;
      if (!d || !Array.isArray(d.txs) || !Array.isArray(d.goals) || typeof d.budgets !== 'object') throw 0;
      if (!window.confirm('Pulihkan data dari backup? Data yang ada sekarang akan diganti.')) return;
      S = Object.assign({ v: 1, demo: false, budgetsDemo: false, sakura: true, theme: 'auto' }, d); save();
      toast('Data berhasil dipulihkan 🌸'); setTimeout(() => location.reload(), 900);
    } catch (e) { toast('File backup tidak dikenali. Pilih file backup Grace ya.'); }
  };
  rd.readAsText(file);
}
async function exportXLSX(ym) {

  const d = reportData(ym), wb = XLSX.utils.book_new();
  const sm = [['Laporan Keuangan Grace'], [monthLabel(ym)], [], ['Total masuk', d.inc], ['Total keluar', d.exp], ['Sisa', d.rest], [], ['Kategori pengeluaran', 'Jumlah (Rp)'], ...d.cats.map(c => [c.k, c.v])];

}
const ascii = s => String(s || '').replace(/[^\x20-\x7E -ÿ]/g, '').trim();
async function exportPDF(ym) {
  const J = window.jspdf && window.jspdf.jsPDF; if (!J) { toast('Pustaka PDF belum termuat. Coba lagi sebentar ya.'); return; }
  const d = reportData(ym), doc = new J({ unit: 'mm', format: 'a4' }); let y = 20;
  const line = (txt, x, size, bold, col) => { doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(size); doc.setTextColor(...(col || [79, 37, 64])); doc.text(txt, x, y); };
  doc.setFillColor(255, 199, 221); doc.rect(0, 0, 210, 34, 'F');

  line(`Total masuk   : ${rp(d.inc)}`, 14, 12, true, [31, 138, 91]); y += 7; line(`Total keluar  : ${rp(d.exp)}`, 14, 12, true, [204, 53, 99]); y += 7; line(`Sisa          : ${rp(d.rest)}`, 14, 12, true); y += 12;
  line('Pengeluaran per kategori', 14, 13, true, [204, 53, 99]); y += 7;

  y += 6; line('Daftar transaksi', 14, 13, true, [204, 53, 99]); y += 7;
  rowsFor(ym).forEach(r => {

function onTxSaved(t, btn, before) {
  const r = btn.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, 'petal', 30);
  if (t.type === 'in') { reactCat('happy', 'Yeay! Pemasukan baru buat Grace! 💕'); setTimeout(heartsFromCat, 150); toast('Pemasukan tercatat. Yeay, Grace! 💕'); return; }
  const b = S.budgets[t.cat];
  if (b) {
    const ym = ymOf(t.date), after = spentIn(t.cat, ym) / b * 100;
    if (after >= 100 && before < 100) { reactCat('shock', overText(t.cat) + ' 😿', 4600); toast(overText(t.cat) + ' 😿'); return; }
    if (after >= 80 && before < 80) { reactCat('', warnText(t.cat) + ' 🐾', 4600); toast(warnText(t.cat) + ' 🐾'); return; }
  }
  if (t.amount >= BIG) { reactCat('shock', 'Waduh Grace, pengeluarannya besar banget! 😿', 4600); toast('Pengeluaran besar tercatat. Kucingnya kaget 🙀'); }
  else toast('Tersimpan! Pintar, Grace! 🌸');
}
function submitTx(form) {
  const fd = new FormData(form), type = fd.get('type') === 'in' ? 'in' : 'out';
  const amount = parseNum(fd.get('amount')), date = fd.get('date'), err = $('#f-err');
  if (!date) { err.textContent = 'Tanggalnya diisi dulu ya, Grace.'; return; }
  if (amount <= 0) { err.textContent = 'Jumlahnya masih kosong, Grace. Isi dulu ya.'; $('#f-amt').focus(); return; }
  err.textContent = '';
  const cat = fd.get('cat') || (type === 'in' ? INC : EXP)[0][0];
  const data = { type, date, amount, cat, note: String(fd.get('note') || '').trim(), wallet: fd.get('wallet') || 'Cash', method: type === 'out' ? (fd.get('method') || 'Cash') : '' };
  const btn = $('#f-save'), wasEdit = !!ui.editId;
  const before = type === 'out' && S.budgets[cat] ? spentIn(cat, ymOf(date)) / S.budgets[cat] * 100 : 0;
  if (wasEdit) { const i = S.txs.findIndex(t => t.id === ui.editId); S.txs[i] = Object.assign({}, S.txs[i], data, { demo: false }); ui.editId = null; }
  else S.txs.push(Object.assign({ id: uid(), ts: Date.now() }, data));
  save(); ui.addType = type;
  onTxSaved(data, btn, wasEdit ? 100 : before);
  setTimeout(() => { location.hash = wasEdit ? 'riwayat' : 'dashboard'; if (cur === 'catat') go(); }, 1300);
}

/* ---------- modal: add saving ---------- */
function openSaving(id) {
  const g = S.goals.find(x => x.id === id); if (!g) return;
  $('#modalRoot').innerHTML = `<div class="modal-back" data-act="closeModal"><div class="modal card" role="dialog" aria-modal="true" aria-labelledby="mTitle">
<h3 id="mTitle">Tambah Tabungan Grace</h3><p class="muted small">${esc(g.name)} · terkumpul ${rp(g.saved)} dari ${rp(g.target)}</p>
<div class="mscene" id="mscene">${TREE}<div class="ground"></div>${catEl({ walk: false, mood: '' })}${PIGGY}<div class="coin-fly" id="coin">$</div></div>
<form class="form" data-form="saving" data-id="${g.id}" style="gap:10px" novalidate>
<label class="field"><span>Jumlah ditabung (Rp)</span><span class="amt-wrap"><i>Rp</i><input class="inp money" id="s-amt" name="amount" inputmode="numeric" placeholder="0"></span></label>
<div class="quick">${[50000, 100000, 250000, 500000].map(v => `<button class="btn btn-soft" type="button" data-act="quick" data-v="${v}">+${rpc(v)}</button>`).join('')}</div>
<p class="err" id="s-err" role="alert"></p>
<button class="btn btn-primary btn-big" type="submit" id="s-btn">Masukkan ke Celengan 🪙</button>
<button class="btn btn-ghost" type="button" data-act="closeModal">Batal</button></form></div></div>`;
  setTimeout(() => { const i = $('#s-amt'); if (i) i.focus(); }, 60);
}
function closeModal() { $('#modalRoot').innerHTML = ''; }
function submitSaving(form) {
  const g = S.goals.find(x => x.id === form.dataset.id), amt = parseNum($('#s-amt').value);
  if (!g) return closeModal(); if (amt <= 0) { $('#s-err').textContent = 'Isi jumlahnya dulu ya, Grace.'; return; }
  $('#s-btn').disabled = true;
  const sc = $('#mscene'), coin = $('#coin'), pig = $('.piggy', sc), cat = $('.cat-cv', sc), sr = sc.getBoundingClientRect(), pr = pig.getBoundingClientRect(), cr = cat.getBoundingClientRect();
  cat.dataset.mood = 'rich'; hop($('.cat-wrap', sc));
  const sx = cr.left - sr.left + cr.width * .2, sy = cr.top - sr.top + cr.height * .7, ex = pr.left - sr.left + pr.width * .42, ey = pr.top - sr.top + pr.height * .18;
  coin.style.opacity = 1;
  coin.animate([{ transform: `translate(${sx}px,${sy}px) rotate(0)`, opacity: 1 }, { transform: `translate(${(sx + ex) / 2}px,${Math.min(sy, ey) - 50}px) rotate(260deg)`, opacity: 1, offset: .5 }, { transform: `translate(${ex}px,${ey + 6}px) rotate(540deg) scale(.7)`, opacity: 0 }], { duration: 1000, easing: 'ease-in', fill: 'forwards', delay: 250 });
  pig.classList.add('wig');
  setTimeout(() => {
    const was = g.saved >= g.target; g.saved += amt; g.demo = g.demo; save(); closeModal(); go();
    const done = !was && g.saved >= g.target;
    reactCat('rich', done ? 'Target tercapai! Grace luar biasa! 🎉' : 'Yeay, tabungan Grace nambah! 🪙', 4200);
    burst(innerWidth / 2, innerHeight / 2.4, 'petal', done ? 44 : 26); heartsFromCat();
    toast(done ? `Target "${g.name}" tercapai! Selamat, Grace! 🎉` : `+${rp(amt)} masuk celengan. Semangat, Grace! 🐷`);
  }, 1700);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const w = e.target.closest('.cat-wrap'); if (w) hop(w);
  const a = e.target.closest('[data-act]'); if (!a) return;
  if (a.dataset.act === 'closeModal' && e.target !== a && !e.target.closest('button[data-act="closeModal"]')) return;
  if (a.dataset.confirm && !a.dataset.armed) {
    a.dataset.armed = '1'; a.dataset.orig = a.innerHTML; a.textContent = a.dataset.confirm; a.classList.add('armed');
    setTimeout(() => { if (a.isConnected && a.dataset.armed) { a.innerHTML = a.dataset.orig; a.classList.remove('armed'); delete a.dataset.armed; } }, 3200); return;
  }
  const id = a.dataset.id;
  switch (a.dataset.act) {
    case 'edit': ui.editId = id; if (cur === 'catat') go(); else location.hash = 'catat'; break;
    case 'cancelEdit': ui.editId = null; location.hash = 'riwayat'; break;
    case 'del': S.txs = S.txs.filter(t => t.id !== id); save(); $('#histList').innerHTML = histList(); toast('Catatan dihapus 🗑️'); break;
    case 'clearFilters': ui.f = { q: '', from: '', to: '', cat: '', wal: '' }; rerender(); break;
    case 'resetDemo': S.txs = S.txs.filter(t => !t.demo); S.goals = S.goals.filter(g => !g.demo); if (S.budgetsDemo) S.budgets = {}; S.demo = false; S.budgetsDemo = false; save(); rerender(); toast('Siap mulai dari nol, Grace! 🌸'); break;
    case 'toggleGoalForm': ui.gform = !ui.gform; $('#goalForm').hidden = !ui.gform; a.setAttribute('aria-expanded', ui.gform); if (ui.gform) $('#goalForm input').focus(); break;
    case 'goalAdd': openSaving(id); break;
    case 'goalDel': S.goals = S.goals.filter(g => g.id !== id); save(); rerender(); toast('Target dihapus'); break;
    case 'closeModal': closeModal(); break;
    case 'quick': { const i = $('#s-amt'); i.value = fmtNum(parseNum(i.value) + +a.dataset.v); break; }
    case 'monthPrev': ui.rm = addMonth(ui.rm, -1); rerender(); break;
    case 'monthNext': if (ui.rm < curYM()) { ui.rm = addMonth(ui.rm, 1); rerender(); } break;
    case 'pdf': exportPDF(ui.rm); break;
    case 'xlsx': exportXLSX(ui.rm); break;
    case 'copy': copyTSV(ui.rm); break;
    case 'backup': doBackup(); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('.modal-back')) closeModal();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('cat-wrap')) { e.preventDefault(); hop(e.target); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('money')) { const n = parseNum(t.value); t.value = n ? fmtNum(n) : ''; }
  if (t.dataset && t.dataset.f) { ui.f[t.dataset.f] = t.value; $('#histList').innerHTML = histList(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.f) { ui.f[t.dataset.f] = t.value; $('#histList').innerHTML = histList(); }
  if (t.name === 'type' && t.closest('[data-form="tx"]')) {
    ui.addType = t.value; $('#catChips').innerHTML = catChips(t.value); $('#metBox').hidden = t.value === 'in';
  }
  if (t.id === 'restoreFile') { const f = t.files && t.files[0]; if (f) doRestore(f); t.value = ''; return; }
  if (t.id === 'gphoto') {
    const f = t.files && t.files[0]; if (!f) { ui.gphoto = null; $('#gprev').innerHTML = ''; return; }
    const rd = new FileReader();
    rd.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, 520 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); ui.gphoto = c.toDataURL('image/jpeg', .78); $('#gprev').innerHTML = `<img class="thumb" src="${ui.gphoto}" alt="Pratinjau foto target">`; }; im.onerror = () => { $('#g-err').textContent = 'Fotonya tidak bisa dibuka. Coba foto lain ya.'; }; im.src = rd.result; };
    rd.readAsDataURL(f);
  }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
  switch (f.dataset.form) {
    case 'tx': submitTx(f); break;
    case 'saving': submitSaving(f); break;
    case 'budget': { const n = parseNum($('input', f).value), k = f.dataset.cat; if (n > 0) S.budgets[k] = n; else delete S.budgets[k]; S.budgetsDemo = false; save(); rerender(); toast(n > 0 ? `Budget ${k} disimpan 🎯` : `Budget ${k} dihapus`); break; }
    case 'goal': {
      const fd = new FormData(f), name = String(fd.get('name') || '').trim(), target = parseNum(fd.get('target')), err = $('#g-err');
      if (!name) { err.textContent = 'Nama targetnya diisi dulu ya, Grace.'; return; }
      if (target <= 0) { err.textContent = 'Nominal targetnya masih kosong.'; return; }
      S.goals.push({ id: uid(), name, target, saved: parseNum(fd.get('saved')), deadline: fd.get('deadline') || toISO(new Date()), photo: ui.gphoto, emoji: '🎯' });
      ui.gphoto = null; ui.gform = false; save(); rerender(); reactCat('rich', 'Target baru! Semangat nabung, Grace! 🪙'); toast('Target baru tersimpan 🌸'); break;
    }
  }
});
window.addEventListener('hashchange', go);

/* ---------- toggles ---------- */
const root = document.documentElement, mq = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => S.theme === 'dark' || (S.theme === 'auto' && mq.matches);
function applyTheme() { if (S.theme === 'auto') delete root.dataset.theme; else root.dataset.theme = S.theme; const b = $('#btnTheme'); b.textContent = isDark() ? '☀️' : '🌙'; b.title = isDark() ? 'Mode terang' : 'Mode gelap'; }
$('#btnTheme').addEventListener('click', () => { S.theme = isDark() ? 'light' : 'dark'; save(); applyTheme(); });
mq.addEventListener && mq.addEventListener('change', applyTheme);
function applySakura() { $('#btnSakura').setAttribute('aria-pressed', String(!!S.sakura)); $('#sakura').hidden = !S.sakura; }
$('#btnSakura').addEventListener('click', () => { S.sakura = !S.sakura; save(); applySakura(); });
applyTheme(); applySakura();

/* ---------- boot ---------- */
$('#hdrCat').innerHTML = catEl({ part: 'head', react: true });
$('#loaderCat').innerHTML = catSVG({ walk: true });
go();
const hideLoader = () => { const l = $('#loader'); l.classList.add('hide'); setTimeout(() => l.remove(), 600); };
const minWait = new Promise(r => setTimeout(r, 1900));
const fontsReady = (document.fonts && document.fonts.ready) ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2500))]) : Promise.resolve();
Promise.all([minWait, fontsReady]).then(hideLoader, hideLoader);
})();
</script>

</body></html>
